name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 构建 · 单测 · 代理契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm build

      - name: 单元测试
        run: pnpm test:unit

      - name: AI 代理契约检查
        run: pnpm test:ai-proxy

  e2e:
    name: E2E 主链路
    needs: quality
    runs-on: ubuntu-latest
    env:
      # 置空后使用 Playwright 自带 Chromium（CI 环境没有 Edge）
      PW_CHANNEL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: pnpm test:e2e

      - name: 上传失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
